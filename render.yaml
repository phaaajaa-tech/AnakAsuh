services:
  - type: web
    name: anakasuh
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    preDeployCommand: npm run db:init
    startCommand: npm start
    initialDeployHook: npm run create-admin
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anakasuh-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          name: anakasuh
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: anakasuh-db
    region: singapore
    plan: free
