<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Verifikasi Email</title><style>body{font-family:Segoe UI,sans-serif;background:#f1f8e9;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:28px;border-radius:16px;max-width:440px;text-align:center;box-shadow:0 6px 24px #0001}button{padding:12px 18px;border:0;border-radius:10px;background:#2e7d32;color:white;font-weight:700}</style></head><body><div class="box"><h2 id="t">Memverifikasi email...</h2><p id="p">Mohon tunggu.</p><button onclick="location.href='/login.html'">Ke Login</button></div><script>const token=new URLSearchParams(location.search).get('token');fetch('/api/auth/verify-email?token='+encodeURIComponent(token||'')).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(x=>{document.getElementById('t').textContent=x.ok?'Email berhasil diverifikasi':'Verifikasi gagal';document.getElementById('p').textContent=x.d.message||x.d.error}).catch(()=>document.getElementById('p').textContent='Terjadi kesalahan.');</script></body></html>
