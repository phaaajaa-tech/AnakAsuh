<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reset Password — AnakAsuh</title><style>body{font-family:Segoe UI,sans-serif;background:#f1f8e9;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:28px;border-radius:16px;max-width:440px;width:calc(100% - 40px);box-shadow:0 6px 24px #0001}input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border:1px solid #c8e6c9;border-radius:10px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#2e7d32;color:white;font-weight:700}</style></head><body><div class="box"><h2>Password Baru</h2><p>Buat password minimal 8 karakter.</p><input id="p1" type="password" minlength="8"><input id="p2" type="password" minlength="8"><button onclick="reset()">Simpan Password</button><p id="m"></p></div><script>async function reset(){const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1.length<8||p1!==p2){document.getElementById('m').textContent='Password minimal 8 karakter dan harus sama.';return}const token=new URLSearchParams(location.search).get('token');const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p1})});const d=await r.json();document.getElementById('m').textContent=d.message||d.error;if(r.ok)setTimeout(()=>location.href='/login.html',1000)}</script></body></html>
