<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dinas — AnakAsuh</title><style>body{font-family:Segoe UI,Roboto,sans-serif;background:#f1f8e9;margin:0;color:#1b5e20}.wrap{max-width:1000px;margin:auto;padding:24px}.top{background:#2e7d32;color:#fff;border-radius:16px;padding:20px;display:flex;justify-content:space-between;gap:10px;align-items:center}.card{background:#fff;border-radius:14px;padding:18px;margin-top:16px;box-shadow:0 2px 10px #0001}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #eee;padding:14px 0}.row:last-child{border-bottom:0}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.ok{background:#2e7d32;color:#fff}.bad{background:#ffebee;color:#c62828}.muted{color:#666;font-size:13px}@media(max-width:600px){.row{align-items:flex-start;flex-direction:column}.actions{width:100%;display:flex;gap:8px}.actions button{flex:1}}</style></head><body><div class="wrap"><div class="top"><div><h2 style="margin:0">Admin Dinas AnakAsuh</h2><div>Validasi pendaftaran pengguna</div></div><button onclick="logout()">Keluar</button></div><div class="card"><h3>Menunggu Validasi</h3><div id="list">Memuat...</div></div></div><script>
async function load(){const r=await fetch('/api/admin/pending');if(r.status===401){location.href='/login.html';return}if(r.status===403){document.getElementById('list').textContent='Akun ini bukan Admin Dinas.';return}const d=await r.json();const box=document.getElementById('list');if(!d.users.length){box.textContent='Tidak ada pendaftaran yang menunggu.';return}box.innerHTML=d.users.map(u=>`<div class="row"><div><strong>${u.full_name||'-'}</strong><div class="muted">${u.email} • ${u.phone_number||'-'} • ${u.role==='CHILD'?'Anak Asuh':'Orang Tua Angkat'}</div><div class="muted">Email: ${u.email_verified_at?'Sudah diverifikasi':'Belum diverifikasi'}</div></div><div class="actions"><button class="ok" onclick="approve('${u.id}')">Aktifkan</button><button class="bad" onclick="suspend('${u.id}')">Tangguhkan</button></div></div>`).join('')}
async function approve(id){if(!confirm('Aktifkan akun ini?'))return;const r=await fetch('/api/admin/users/'+id+'/approve',{method:'POST'});const d=await r.json();alert(d.message||d.error);load()}async function suspend(id){if(!confirm('Tangguhkan akun ini?'))return;const r=await fetch('/api/admin/users/'+id+'/suspend',{method:'POST'});const d=await r.json();alert(d.message||d.error);load()}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login.html'}load();
</script></body></html>
