<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — AnakAsuh</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Roboto,sans-serif;background:#f1f8e9;color:#1b5e20;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(100%,440px);background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0001}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand img:first-child{width:230px;max-width:72%}.brand img:last-child{width:52px;height:68px;object-fit:contain}h1{font-size:24px;margin:0 0 6px}p{color:#555}.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;padding:11px;border:1px solid #a5d6a7;background:white;border-radius:10px;font-weight:700;color:#2e7d32}.tab.active{background:#2e7d32;color:white}label{display:block;font-weight:600;margin-top:12px}input,select{width:100%;padding:12px;border:1.5px solid #c8e6c9;border-radius:10px;margin-top:6px;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2e7d32;color:#fff;font-size:15px;font-weight:700;margin-top:16px;cursor:pointer}.secondary{background:#e8f5e9;color:#2e7d32}.msg{margin-top:14px;padding:12px;border-radius:10px;display:none}.err{background:#ffebee;color:#c62828}.ok{background:#e8f5e9;color:#1b5e20}.small{font-size:13px;text-align:center;margin-top:14px}.link{color:#2e7d32;font-weight:700;cursor:pointer}.hidden{display:none}
</style></head><body><main class="box"><div class="brand"><img src="logo_anakasuh_header.png"><img src="logo_bungo.png"></div><h1 id="judul">Masuk ke AnakAsuh</h1><p id="sub">Gunakan email dan password akun Anda sendiri.</p><div class="tabs"><button type="button" class="tab active" id="tabLogin" onclick="mode('login')">Login</button><button type="button" class="tab" id="tabReg" onclick="mode('register')">Daftar</button></div><form id="form"><div id="namaWrap" class="hidden"><label>Nama Lengkap</label><input id="nama"></div><label>Email</label><input id="email" type="email" autocomplete="email" required><div id="phoneWrap" class="hidden"><label>No. Telepon</label><input id="phone" type="tel"></div><div id="roleWrap" class="hidden"><label>Daftar sebagai</label><select id="role"><option value="SPONSOR">Orang Tua Angkat</option><option value="CHILD">Anak Asuh</option></select></div><label>Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><div id="confirmWrap" class="hidden"><label>Ulangi Password</label><input id="confirm" type="password" minlength="8"></div><button id="submit">Login</button></form><button class="secondary" id="forgot" onclick="forgot()">Lupa Password</button><div id="msg" class="msg"></div><div class="small" id="verifyLink">Belum menerima email verifikasi? <span class="link" onclick="resend()">Kirim ulang</span></div></main><script>
let current='login'; const $=id=>document.getElementById(id); function mode(m){current=m;$('tabLogin').classList.toggle('active',m==='login');$('tabReg').classList.toggle('active',m==='register');$('judul').textContent=m==='login'?'Masuk ke AnakAsuh':'Buat Akun AnakAsuh';$('sub').textContent=m==='login'?'Gunakan email dan password akun Anda sendiri.':'Gunakan email milik Anda sendiri. Setelah daftar, email harus diverifikasi.';['namaWrap','phoneWrap','roleWrap','confirmWrap'].forEach(x=>$(x).classList.toggle('hidden',m==='login'));$('forgot').classList.toggle('hidden',m!=='login');$('submit').textContent=m==='login'?'Login':'Daftar';}
function show(t,ok=false){$('msg').style.display='block';$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}
$('form').onsubmit=async e=>{e.preventDefault();try{const body=current==='login'?{email:$('email').value,password:$('password').value}:{email:$('email').value,password:$('password').value,fullName:$('nama').value,phone:$('phone').value,role:$('role').value};if(current==='register'&&$('password').value!==$('confirm').value)throw Error('Password tidak sama.');const r=await fetch('/api/auth/'+(current==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Gagal');show(d.message,true);if(current==='login')setTimeout(()=>location.href='/',500);}catch(e){show(e.message)}};
async function forgot(){const email=prompt('Masukkan email akun Anda:');if(!email)return;const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();show(d.message,true)}async function resend(){const email=$('email').value||prompt('Masukkan email akun Anda:');if(!email)return;const r=await fetch('/api/auth/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();show(d.message,true)}
fetch('/api/auth/me').then(r=>{if(r.ok)location.href='/'});
</script></body></html>
